services:
    app:
        container_name: laravel_app_filament
        working_dir: /var/www/html
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - .:/var/www/html/app # Mount project ke /var/www/html/app
            - ./.docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
            - storage:/var/www/html/storage

    web:
        image: nginx:alpine
        container_name: laravel_nginx
        ports:
            - "8100:80"
        volumes:
            - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - public:/var/www/html # Mount ke /var/www/html
        depends_on:
            - app

volumes:
    storage:
    public:
